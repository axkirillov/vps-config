name: Deploy to VPS

# Supply chain hardening:
# - No third-party actions: plain SSH avoids dependency on external action repos.
# - SSH key scoped to a single VPS, stored as a GitHub secret.
# - Docker images are pinned by SHA256 digest (see docker-compose files).
#
# The host is addressed by its IPv4 literal on purpose. GitHub-hosted runners
# have no IPv6 egress, so the VPS's AAAA address fails with "Network is
# unreachable" before SSH ever starts. The A record is 116.203.206.66.

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (no third-party actions)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key \
            root@116.203.206.66 \
            /root/vps-config/deploy.sh

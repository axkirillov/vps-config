# Managed by vps-config — deployed to /etc/resolv.conf by deploy.sh.
#
# IPv4 resolvers come first on purpose. This file previously held only Hetzner's
# DNS64 resolvers (2a00:1098:2b::1, 2a01:4f9:c010:3f02::1), which are IPv6-only.
# On 2026-10-13 the host's upstream IPv6 path broke while the link-local gateway
# kept answering, so every name lookup failed: git pulls, ACME and container
# image pulls all stopped, even though IPv4 egress was fine. Leading with IPv4
# resolvers removes that single point of failure.
#
# The IPv6 DNS64 resolvers stay last: when IPv6 works they are the ones that
# synthesise AAAA records for the NAT64 path.
#
# Hetzner's own resolvers first, then a third party so that one provider having
# a bad day does not take DNS down.
nameserver 185.12.64.1
nameserver 185.12.64.2
nameserver 1.1.1.1
nameserver 2a00:1098:2b::1
nameserver 2a01:4f9:c010:3f02::1

# Fail over to the next server after 2s rather than glibc's 5s default.
options timeout:2 attempts:2

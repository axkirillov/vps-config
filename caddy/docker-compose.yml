services:
  caddy:
    image: caddy:latest@sha256:25cdc846626b62d05f6b633b9b40c2c9f6ef89b515dc76133cefd920f7dbe562
    container_name: caddy
    restart: unless-stopped
    network_mode: "host"
    volumes:
      # The directory, not the file: a single-file bind mount is pinned to the
      # inode that existed when the container started, so `git pull` replacing
      # the Caddyfile left the running container serving the old config forever.
      - ./:/etc/caddy:ro
      - ./data:/data
      - ./config:/config
      - /root/spending:/www:ro
      - ../recipes:/srv/recipes:ro
      - ../trockner:/srv/trockner:ro
